<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Tahoma", "Leelawadee UI", sans-serif;
   
      background: #f3f7f4;
    }
    header {
      background: #214b3d;
      color: #fff;
      padding: 15px 4%;
      box-shadow: 0 3px 12px rgba(20, 50, 39, .10);
    }
    .site-name {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 26px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    nav a {
      color: #f4f8f5;
      text-decoration: none;
      font-size: 14px;
      transition: opacity .2s;
    }
    nav a:hover, nav a.active { opacity: .78; text-decoration: underline; text-underline-offset: 5px; }
    main {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 38px 18px 48px;
    }
    .login-card {
      width: 100%;
      max-width: 430px;
      background: #fff;
      padding: 34px 30px 30px;
      border: 1px solid #e7eee9;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(31, 73, 57, .08);
    }
    .login-card h1 {
      margin: 0;
      text-align: center;
      color: #214b3d;
      font-size: 27px;
    }
    .subtitle {
      margin: 12px 0 27px;
      text-align: center;
      color: #84918a;
      font-size: 13px;
    }
    .field { margin-bottom: 19px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #34483f;
      font-size: 14px;
      font-weight: 700;
    }
    input, select {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid #d8e1db;
      border-radius: 7px;
      background: #fff;
      color: #30443a;
      font: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: #39745d;
      box-shadow: 0 0 0 3px rgba(57, 116, 93, .12);
    }
    .password-row { display: flex; gap: 8px; }
    .password-row input { flex: 1; min-width: 0; }
    .show-btn {
      border: 0;
      border-radius: 7px;
      padding: 0 16px;
      color: #fff;
      background: #214b3d;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .show-btn:hover, .submit-btn:hover { background: #183b30; }
    .submit-btn {
      width: 100%;
      height: 46px;
      margin-top: 7px;
      border: 0;
      border-radius: 8px;
      background: #214b3d;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .submit-btn:active { transform: translateY(1px); }
    .demo {
      margin: 24px 0 0;
      padding: 13px 14px;
      border-radius: 8px;
      background: #f1f6f2;
      color: #65776d;
      font-size: 12px;
      line-height: 1.8;
    }
    .demo strong { color: #345b48; }
    #message {
      min-height: 18px;
      margin: 12px 0 0;
      text-align: center;
      font-size: 13px;
      color: #a13c35;
    }
    footer {
      padding: 15px 18px;
      background: #e8f0eb;
      color: #718078;
      text-align: center;
      font-size: 12px;
    }
    @media (max-width: 520px) {
      header { padding: 14px 20px; }
      nav ul { gap: 10px 17px; }
      nav a { font-size: 13px; }
      .login-card { padding: 28px 21px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="site-name">เที่ยวบ้านเรา</p>
    <nav aria-label="เมนูหลัก">
      <ul>
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="places.html">ที่เที่ยว</a></li>
        <li><a href="food.html">อาหาร</a></li>
        <li><a href="plan.html">วางแผนเที่ยว</a></li>
        <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
        <li><a class="active" href="login.html">เข้าสู่ระบบ</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">เข้าสู่ระบบ</h1>
      <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <input id="username" name="username" type="text"
                 placeholder="กรอกชื่อผู้ใช้" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="password-row">
            <input id="password" name="password" type="password"
                   placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
            <button class="show-btn" type="button" id="togglePassword">แสดง</button>
          </div>
        </div>

        <div class="field">
          <label for="role">ประเภทผู้ใช้งาน</label>
          <select id="role" name="role">
            <option value="user">สมาชิก (User)</option>
            <option value="admin">ผู้ดูแลระบบ (Admin)</option>
          </select>
        </div>

        <button class="submit-btn" type="submit">เข้าสู่ระบบ</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>

      <div class="demo">
        <strong>บัญชีทดลองสำหรับฝึกปฏิบัติ</strong><br>
        Admin: <strong>admin</strong> / <strong>admin123</strong>
      </div>
    </section>
  </main>

  <footer>
    <p>ศุภิสรา เฉลียวยิ่ง 075 | งานฝึกปฏิบัติวิชาการสร้างเว็บไซต์ทางธุรกิจ</p>
  </footer>

  <script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');

    toggleButton.addEventListener('click', function () {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleButton.textContent = isHidden ? 'ซ่อน' : 'แสดง';
    });

    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;
      const role = document.getElementById('role').value;
      const message = document.getElementById('message');

      if (role === 'admin' && username === 'admin' && password === 'admin123') {
        message.style.color = '#28734f';
        message.textContent = 'เข้าสู่ระบบผู้ดูแลเรียบร้อย (บัญชีทดลอง)';
      } else {
        message.style.color = '#a13c35';
        message.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง หรือบัญชีนี้ยังไม่ได้เชื่อมต่อระบบ';
      }
    });
  </script>
</body>
</html>
